[project]
name = "grl"
version = "0.1.0"
description = "Python client and Gymnasium environment for the GodotRocketLanding simulator"
requires-python = ">=3.10"
dependencies = ["websockets", "gymnasium", "numpy"]

[project.optional-dependencies]
train = ["torch", "tqdm", "tensorboard"]
sb3 = ["stable-baselines3>=2.3", "torch"]
rllib = ["ray[rllib]>=2.40", "torch"]
skrl = ["skrl>=2", "torch"]
tianshou = ["tianshou[eval]>=2", "torch"]
torchrl = ["torchrl>=0.14", "torch"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
