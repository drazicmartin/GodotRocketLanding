name: World model environment
on:
  pull_request:
  push:
    branches: [dev, world-model-env]
permissions:
  contents: read
jobs:
  gymnasium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python adapter and test tools
        run: python -m pip install -e '.[test]'
      - name: Python contract tests
        run: python -m pytest -q -m 'not simulator'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import source project
        run: '"$GODOT_BIN" --headless --path . --editor --import --quit'
      - name: Real Godot RGB and stepping tests
        env:
          GRL_TEST_SIMULATOR: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest -q -m simulator
